<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --black: #000000;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.12);
    --text-primary: rgba(255, 255, 255, 0.95);
    --text-secondary: rgba(255, 255, 255, 0.6);
    --text-muted: rgba(255, 255, 255, 0.35);
    --accent: #7dd3a0;
    --accent-glow: rgba(125, 211, 160, 0.3);
  }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Full-screen background canvas */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Dark overlay for text legibility */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(180deg,
        rgba(0,0,0,0.3) 0%,
        rgba(0,0,0,0.1) 30%,
        rgba(0,0,0,0.1) 60%,
        rgba(0,0,0,0.6) 100%
      ),
      radial-gradient(ellipse at 30% 50%, rgba(0,0,0,0.4) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Grain texture */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    opacity: 0.04;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px;
  }

  /* Main content layer */
  .content {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(24px, 4vw, 48px);
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--glass-border);
    opacity: 0;
    animation: slideDown 0.8s 0.5s ease forwards;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }

  nav {
    display: flex;
    gap: 32px;
    align-items: center;
  }

  nav a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.3px;
    transition: color 0.3s;
    position: relative;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--accent);
    transition: width 0.3s;
  }

  nav a:hover { color: var(--text-primary); }
  nav a:hover::after { width: 100%; }

  .nav-cta {
    padding: 8px 20px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    color: var(--text-primary) !important;
    font-weight: 500;
    transition: all 0.3s !important;
  }

  .nav-cta:hover {
    background: rgba(255,255,255,0.15) !important;
    border-color: rgba(255,255,255,0.25) !important;
  }

  .nav-cta::after { display: none !important; }

  /* Hero section */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 120px clamp(24px, 6vw, 80px) 80px;
    max-width: 800px;
  }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.5px;
    width: fit-content;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s ease forwards;
  }

  .hero-tag .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 8vw, 88px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.8s 1s ease forwards;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-subtitle {
    font-size: clamp(18px, 2.5vw, 24px);
    color: var(--text-secondary);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.8s 1.1s ease forwards;
  }

  .hero p {
    font-size: clamp(16px, 2vw, 20px);
    line-height: 1.7;
    color: var(--text-secondary);
    max-width: 520px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s 1.2s ease forwards;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    align-items: center;
    opacity: 0;
    animation: fadeUp 0.8s 1.4s ease forwards;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: var(--white);
    color: var(--black);
    border: none;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,255,255,0.2);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 28px;
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }

  .btn-secondary:hover {
    background: var(--glass);
    border-color: rgba(255,255,255,0.25);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Stats bar */
  .stats {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    gap: 1px;
    background: var(--glass-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--glass-border);
    opacity: 0;
    animation: slideUp 0.6s 1.8s ease forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .stat {
    flex: 1;
    max-width: 200px;
    padding: 20px 24px;
    text-align: center;
    background: rgba(0,0,0,0.5);
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Scroll indicator */
  .scroll-hint {
    position: fixed;
    bottom: 100px;
    right: 40px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeUp 0.6s 2s ease forwards;
  }

  .scroll-hint span {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    writing-mode: vertical-rl;
  }

  .scroll-line {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, var(--text-muted), transparent);
    animation: scrollPulse 2s infinite;
  }

  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* Loading overlay */
  .loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: var(--black);
    z-index: 1000;
    transition: opacity 0.6s, visibility 0.6s;
  }

  .loader.done {
    opacity: 0;
    visibility: hidden;
  }

  .loader-ring {
    width: 48px;
    height: 48px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    margin-top: 20px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 2px;
  }

  .loader-bar {
    margin-top: 16px;
    width: 120px;
    height: 2px;
    background: var(--glass-border);
    border-radius: 1px;
    overflow: hidden;
  }

  .loader-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }

  /* Responsive */
  @media (max-width: 768px) {
    nav { display: none; }
    .hero { padding: 140px 24px 120px; }
    .hero-actions { flex-direction: column; align-items: flex-start; }
    .scroll-hint { display: none; }
    .stats { flex-wrap: wrap; }
    .stat { min-width: 50%; }
  }
</style>
</head>
<body>

<!-- Background animation -->
<canvas id="bg"></canvas>
<div class="overlay"></div>
<div class="grain"></div>

<!-- Loading -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Loading</div>
  <div class="loader-bar"><div class="loader-fill" id="loadFill"></div></div>
</div>

<!-- Content -->
<div class="content">
  <header>
    <div class="logo">$title</div>
    <nav>
      <a href="#story">Story</a>
      <a href="#about">About</a>
      <a href="#contact" class="nav-cta">$cta_secondary</a>
    </nav>
  </header>

  <section class="hero" id="story">
    <div class="hero-tag">
      <span class="dot"></span>
      $tag
    </div>
    <h1>$hero_title</h1>
    $subtitle
    <p>$description</p>
    <div class="hero-actions">
      <button class="btn-primary" onclick="toggle()">
        $cta_primary
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a href="#about" class="btn-secondary">$cta_secondary</a>
    </div>
  </section>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat">
    <div class="stat-value">$frame_count</div>
    <div class="stat-label">Frames</div>
  </div>
  <div class="stat">
    <div class="stat-value">${fps}fps</div>
    <div class="stat-label">Frame Rate</div>
  </div>
  <div class="stat">
    <div class="stat-value">${duration}s</div>
    <div class="stat-label">Duration</div>
  </div>
  <div class="stat">
    <div class="stat-value">AI</div>
    <div class="stat-label">Generated</div>
  </div>
</div>

<!-- Scroll hint -->
<div class="scroll-hint">
  <span>Scroll</span>
  <div class="scroll-line"></div>
</div>

<script>
const TOTAL = $frame_count;
const FPS = $fps;

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const loader = document.getElementById('loader');
const loadFill = document.getElementById('loadFill');

let frames = [];
let current = 0;
let playing = false;
let lastTime = 0;
let loaded = 0;
let ready = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (frames[current] && frames[current].complete) draw(current);
}

function draw(idx) {
  if (!frames[idx] || !frames[idx].complete || !frames[idx].naturalWidth) return;
  const img = frames[idx];
  const scale = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;
  const x = (canvas.width - w) / 2;
  const y = (canvas.height - h) / 2;
  ctx.drawImage(img, x, y, w, h);
}

function loop(time) {
  if (!playing) return;
  if (time - lastTime >= 1000 / FPS) {
    current = (current + 1) % TOTAL;
    draw(current);
    lastTime = time;
  }
  requestAnimationFrame(loop);
}

function toggle() {
  if (!ready) return;
  playing = !playing;
  if (playing) requestAnimationFrame(loop);
}

function start() {
  if (ready) return;
  ready = true;
  playing = true;
  loader.classList.add('done');
  draw(0);
  requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize', resize);

for (let i = 1; i <= TOTAL; i++) {
  const img = new Image();
  img.onload = () => {
    loaded++;
    loadFill.style.width = (loaded / TOTAL * 100) + '%';
    if (loaded === 1) {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      draw(0);
    }
    if (loaded >= Math.min(12, TOTAL)) start();
  };
  img.src = `public/frames/frame_${String(i).padStart(4, '0')}.jpg`;
  frames.push(img);
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    toggle();
  }
});
</script>
</body>
</html>
